name: Keyword sync

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "TiDB/docs branch to sync. Leave empty to sync all configured branches."
        required: false
        default: ""
  schedule:
    # Runs keyword-sync at 8:00 every Friday (UTC+8)
    - cron: "0 0 * * 5"

permissions:
  contents: read

concurrency:
  group: keyword-sync-${{ github.event.inputs.branch || 'all' }}
  cancel-in-progress: true

jobs:
  plan-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Checkout docs toolkit
        uses: actions/checkout@v6
        with:
          path: docs-toolkit
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Resolve branches
        id: branches
        working-directory: docs-toolkit
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          CONFIGURED="$(uv run --python 3.12 python -m keyword_sync.cli --list-branches)"
          BRANCHES="$(jq -ce --arg branch "$BRANCH" '
            if $branch == "" then .
            elif index($branch) != null then [$branch]
            else error("branch must match a configured keyword-sync branch")
            end
          ' <<< "$CONFIGURED")"
          echo "branches=${BRANCHES}" >> "$GITHUB_OUTPUT"

  keyword-sync:
    needs: plan-branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.plan-branches.outputs.branches) }}
    steps:
      - name: Checkout docs toolkit
        uses: actions/checkout@v6
        with:
          path: docs-toolkit
          persist-credentials: false

      - name: Checkout TiDB source
        uses: actions/checkout@v6
        with:
          repository: pingcap/tidb
          ref: ${{ matrix.branch }}
          path: tidb
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout docs target
        uses: actions/checkout@v6
        with:
          repository: pingcap/docs
          ref: ${{ matrix.branch }}
          path: docs
          persist-credentials: false

      - name: Checkout docs-cn target
        uses: actions/checkout@v6
        with:
          repository: pingcap/docs-cn
          ref: ${{ matrix.branch }}
          path: docs-cn
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Run keyword sync
        working-directory: docs-toolkit
        env:
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ github.token }}
          TIDB_WORKING_DIR: ${{ github.workspace }}/tidb
          DOCS_WORKING_DIR: ${{ github.workspace }}/docs
          DOCS_CN_WORKING_DIR: ${{ github.workspace }}/docs-cn
        run: |
          set -euo pipefail
          META_DIR="${RUNNER_TEMP}/keyword-sync"
          uv run --python 3.12 python -m keyword_sync.cli \
            --branch "${BRANCH}" \
            --metadata-dir "${META_DIR}"
          mkdir -p "${RUNNER_TEMP}/keyword-payload"
          cp ../docs/keywords.md "${RUNNER_TEMP}/keyword-payload/docs-keywords.md"
          cp ../docs-cn/keywords.md "${RUNNER_TEMP}/keyword-payload/docs-cn-keywords.md"
          cp keyword_sync/data/keyword-sync-state.json "${RUNNER_TEMP}/keyword-payload/keyword-sync-state.json"
          cp "${META_DIR}/"*.md "${META_DIR}/outputs.env" "${RUNNER_TEMP}/keyword-payload/"

      - name: Upload generated keyword files
        uses: actions/upload-artifact@v4
        with:
          name: keyword-sync-${{ matrix.branch }}
          path: ${{ runner.temp }}/keyword-payload
          if-no-files-found: error
          retention-days: 1

  publish-keywords:
    needs: [plan-branches, keyword-sync]
    if: github.repository == 'pingcap/docs-toolkit' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.plan-branches.outputs.branches) }}
    steps:
      # Use fresh checkouts; never restore a generator workspace or execute its artifacts.
      - name: Checkout docs toolkit state
        uses: actions/checkout@v6
        with:
          path: docs-toolkit
          persist-credentials: false
          sparse-checkout: keyword_sync/data

      - name: Checkout docs target
        uses: actions/checkout@v6
        with:
          repository: pingcap/docs
          ref: ${{ matrix.branch }}
          path: docs
          persist-credentials: false

      - name: Checkout docs-cn target
        uses: actions/checkout@v6
        with:
          repository: pingcap/docs-cn
          ref: ${{ matrix.branch }}
          path: docs-cn
          persist-credentials: false

      - name: Download generated keyword files
        uses: actions/download-artifact@v4
        with:
          name: keyword-sync-${{ matrix.branch }}
          path: keyword-payload

      - name: Validate and apply generated data
        id: metadata
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re

          payload = Path("keyword-payload")
          files = {
              "docs-keywords.md", "docs-cn-keywords.md", "keyword-sync-state.json",
              "docs-pr-body.md", "docs-pr-comment.md",
              "docs_cn-pr-body.md", "docs_cn-pr-comment.md", "outputs.env",
          }
          if {p.name for p in payload.iterdir()} != files:
              raise SystemExit("Unexpected artifact contents")
          if any(p.is_symlink() or not p.is_file() for p in payload.iterdir()):
              raise SystemExit("Artifacts must contain only regular data files")
          # Read only validated commit IDs; never source generated shell or output paths.
          metadata = dict(line.split("=", 1) for line in (payload / "outputs.env").read_text().splitlines())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for target in ("docs", "docs_cn"):
                  sha = metadata[f"{target}_source_commit"]
                  if not re.fullmatch(r"[0-9a-f]{12}|none", sha):
                      raise SystemExit("Invalid source commit")
                  output.write(f"{target}_source_commit={sha}\n")
                  has_comment = bool((payload / f"{target}-pr-comment.md").read_text().strip())
                  output.write(f"{target}_has_comment={str(has_comment).lower()}\n")
          for source, dest in (
              ("docs-keywords.md", "docs/keywords.md"),
              ("docs-cn-keywords.md", "docs-cn/keywords.md"),
              ("keyword-sync-state.json", "docs-toolkit/keyword_sync/data/keyword-sync-state.json"),
          ):
              destination = Path(dest)
              if any(p.is_symlink() for p in (destination, *destination.parents)):
                  raise SystemExit("Symlink destinations are not allowed")
              destination.write_bytes((payload / source).read_bytes())
          PYTHON

      - name: Create docs GitHub App token
        id: docs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.LLMS_TXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.LLMS_TXT_APP_PRIVATE_KEY }}
          owner: pingcap
          repositories: docs
          permission-contents: write
          permission-pull-requests: write

      - name: Create docs pull request
        id: docs-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.docs-token.outputs.token }}
          path: docs
          add-paths: keywords.md
          base: ${{ matrix.branch }}
          branch: automation/keyword-sync-docs-${{ matrix.branch }}-${{ steps.metadata.outputs.docs_source_commit }}
          delete-branch: true
          sign-commits: true
          commit-message: "docs: sync keywords from TiDB parser"
          title: "docs: sync keywords from TiDB parser"
          body-path: keyword-payload/docs-pr-body.md

      - name: Create docs-cn GitHub App token
        id: docs-cn-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.LLMS_TXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.LLMS_TXT_APP_PRIVATE_KEY }}
          owner: pingcap
          repositories: docs-cn
          permission-contents: write
          permission-pull-requests: write

      - name: Create docs-cn pull request
        id: docs-cn-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.docs-cn-token.outputs.token }}
          path: docs-cn
          add-paths: keywords.md
          base: ${{ matrix.branch }}
          branch: automation/keyword-sync-docs-cn-${{ matrix.branch }}-${{ steps.metadata.outputs.docs_cn_source_commit }}
          delete-branch: true
          sign-commits: true
          commit-message: "docs: sync keywords from TiDB parser"
          title: "docs: sync keywords from TiDB parser"
          body-path: keyword-payload/docs_cn-pr-body.md

      - name: Check for state changes
        id: state
        working-directory: docs-toolkit
        run: |
          if git diff --quiet -- keyword_sync/data/keyword-sync-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create docs-toolkit GitHub App token
        if: steps.state.outputs.changed == 'true'
        id: state-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.LLMS_TXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.LLMS_TXT_APP_PRIVATE_KEY }}
          owner: pingcap
          repositories: docs-toolkit
          permission-contents: write
          permission-pull-requests: write

      - name: Persist keyword sync state
        if: steps.state.outputs.changed == 'true'
        id: state-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.state-token.outputs.token }}
          path: docs-toolkit
          add-paths: keyword_sync/data/keyword-sync-state.json
          base: ${{ github.ref_name }}
          branch: automation/keyword-sync-state-${{ matrix.branch }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore: update keyword sync state for ${{ matrix.branch }}"
          title: "chore: update keyword sync state for ${{ matrix.branch }}"
          body: |
            Updates the keyword sync state after processing TiDB `${{ matrix.branch }}` parser changes.

            Related docs PRs:
            - docs: ${{ steps.docs-pr.outputs.pull-request-url || 'no changes' }}
            - docs-cn: ${{ steps.docs-cn-pr.outputs.pull-request-url || 'no changes' }}

      - name: Comment on docs pull request
        if: steps.docs-pr.outputs.pull-request-url != '' && steps.metadata.outputs.docs_has_comment == 'true'
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          PR_URL: ${{ steps.docs-pr.outputs.pull-request-url }}
          COMMENT_PATH: keyword-payload/docs-pr-comment.md
        run: gh pr comment "${PR_URL}" --body-file "${COMMENT_PATH}"

      - name: Comment on docs-cn pull request
        if: steps.docs-cn-pr.outputs.pull-request-url != '' && steps.metadata.outputs.docs_cn_has_comment == 'true'
        env:
          GH_TOKEN: ${{ steps.docs-cn-token.outputs.token }}
          PR_URL: ${{ steps.docs-cn-pr.outputs.pull-request-url }}
          COMMENT_PATH: keyword-payload/docs_cn-pr-comment.md
        run: gh pr comment "${PR_URL}" --body-file "${COMMENT_PATH}"

      - name: Summarize pull request result
        env:
          BRANCH: ${{ matrix.branch }}
          DOCS_PR_URL: ${{ steps.docs-pr.outputs.pull-request-url }}
          DOCS_CN_PR_URL: ${{ steps.docs-cn-pr.outputs.pull-request-url }}
          STATE_PR_URL: ${{ steps.state-pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Keyword sync result"
            echo ""
            echo "Branch: ${BRANCH}"
            echo ""
            if [ -n "${DOCS_PR_URL}" ]; then
              echo "- docs PR: ${DOCS_PR_URL}"
            else
              echo "- docs: no changes detected"
            fi
            if [ -n "${DOCS_CN_PR_URL}" ]; then
              echo "- docs-cn PR: ${DOCS_CN_PR_URL}"
            else
              echo "- docs-cn: no changes detected"
            fi
            if [ -n "${STATE_PR_URL}" ]; then
              echo "- state PR: ${STATE_PR_URL}"
            else
              echo "- state: no changes detected"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
