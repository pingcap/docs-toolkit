name: Generate llms.txt Updates

on:
  schedule:
    # Runs llms.txt generation at 8:00 every Friday (UTC+8)
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-llms-txt-website-docs
  cancel-in-progress: true

jobs:
  generate-llms-txt:
    outputs:
      source-sha: ${{ steps.docs-staging.outputs.sha }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs-toolkit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout docs-staging input
        uses: actions/checkout@v6
        with:
          repository: pingcap/docs-staging
          ref: main
          path: llms-workspace/docs-staging
          persist-credentials: false
          sparse-checkout: markdown-pages

      - name: Capture docs-staging revision
        id: docs-staging
        run: echo "sha=$(git -C llms-workspace/docs-staging rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout website-docs target
        uses: actions/checkout@v6
        with:
          repository: pingcap/website-docs
          ref: master
          path: llms-workspace/website-docs
          persist-credentials: false
          sparse-checkout: static

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: llms-txt-generator/pyproject.toml

      - name: Install generator dependencies
        run: |
          uv venv llms-txt-generator/.venv
          uv pip install --python llms-txt-generator/.venv/bin/python -r llms-txt-generator/pyproject.toml

      - name: Generate llms.txt files
        env:
          LLMS_WORKING_DIR: ${{ github.workspace }}/llms-workspace
        run: llms-txt-generator/.venv/bin/python llms-txt-generator/generate_llms_txt.py

      - name: Upload generated llms.txt files
        uses: actions/upload-artifact@v4
        with:
          name: generated-llms-txt
          path: llms-workspace/website-docs/static/**/llms.txt
          if-no-files-found: error
          retention-days: 1

  publish-llms-txt:
    needs: generate-llms-txt
    if: github.repository == 'pingcap/docs-toolkit' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website-docs target
        uses: actions/checkout@v6
        with:
          repository: pingcap/website-docs
          ref: master
          path: llms-workspace/website-docs
          persist-credentials: false
          sparse-checkout: static

      - name: Download generated llms.txt files
        uses: actions/download-artifact@v4
        with:
          name: generated-llms-txt
          path: llms-payload

      - name: Validate and apply generated data
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          payload = Path("llms-payload")
          target = Path("llms-workspace/website-docs/static")
          files = []
          for path in payload.rglob("*"):
              if path.is_symlink():
                  raise SystemExit("Symlink artifacts are not allowed")
              if path.is_dir():
                  continue
              relative = path.relative_to(payload)
              if not path.is_file() or path.name != "llms.txt" or any(part.startswith(".") for part in relative.parts):
                  raise SystemExit("Artifact must contain only llms.txt data files")
              dest = target / relative
              if any(parent.is_symlink() for parent in (dest, *dest.parents)):
                  raise SystemExit("Symlink destinations are not allowed")
              files.append((path, dest))
          if not files:
              raise SystemExit("No llms.txt files found")
          for source, dest in files:
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(source.read_bytes())
          PYTHON

      - name: Create website-docs GitHub App token
        id: website-docs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.LLMS_TXT_APP_CLIENT_ID }}
          private-key: ${{ secrets.LLMS_TXT_APP_PRIVATE_KEY }}
          owner: pingcap
          repositories: website-docs
          permission-contents: write
          permission-pull-requests: write

      - name: Create website-docs pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.website-docs-token.outputs.token }}
          path: llms-workspace/website-docs
          add-paths: static
          base: master
          branch: automation/generated-llms-txt
          delete-branch: true
          sign-commits: true
          commit-message: "static: update generated llms.txt files"
          title: "static: update generated llms.txt files"
          assignees: lilin90
          author: pingcap-docs-app[bot] <136219707+pingcap-docs-app[bot]@users.noreply.github.com>
          body: |
            Automated `llms.txt` updates generated from the current `docs-staging` Markdown content.

            Do not commit manual edits to this branch. It is regenerated and may be overwritten by subsequent workflow runs.

            Input content: [`pingcap/docs-staging@${{ needs.generate-llms-txt.outputs.source-sha }}`](https://github.com/pingcap/docs-staging/commit/${{ needs.generate-llms-txt.outputs.source-sha }})

      - name: Summarize pull request result
        env:
          OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          if [ -n "${PR_URL}" ]; then
            echo "Pull request ${OPERATION}: ${PR_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No llms.txt changes detected; no pull request was created." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
